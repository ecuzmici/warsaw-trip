<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131a">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #16181d; --dim: #626976;
    --line: #e2e2dd; --accent: #b4472e; --ok: #2f6f4f; --warn: #8a5a00;
    --on-accent: #ffffff;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11131a; --panel: #191c25; --ink: #eef0f4; --dim: #98a0b0;
      --line: #262a36; --accent: #ff8a6a; --ok: #7fd6a6; --warn: #f0c070;
      --on-accent: #11131a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11131a; --panel: #191c25; --ink: #eef0f4; --dim: #98a0b0;
    --line: #262a36; --accent: #ff8a6a; --ok: #7fd6a6; --warn: #f0c070;
    --on-accent: #11131a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 56px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 1.05rem; margin: 0; letter-spacing: .02em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 700; }
  .clock small { display: block; text-align: right; font-size: .68rem; font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card.now { border-color: var(--accent); border-width: 2px; }
  .kicker { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 700; margin-bottom: 6px; }
  .kicker.hot { color: var(--accent); }
  .name { font-size: 1.35rem; font-weight: 700; line-height: 1.25; margin: 0 0 4px; }
  .when { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .95rem; }
  .note { margin: 10px 0 0; font-size: .92rem; color: var(--ink); }
  .note.risk { color: var(--warn); font-weight: 600; }
  .leave { margin-top: 10px; font-size: .95rem; font-weight: 600; color: var(--ok); font-variant-numeric: tabular-nums; }
  .leave.urgent { color: var(--accent); }
  a.maps {
    display: inline-block; margin-top: 12px; padding: 11px 16px;
    background: var(--accent); color: var(--on-accent); text-decoration: none;
    border-radius: 10px; font-weight: 600; font-size: .95rem;
  }
  a.maps:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  h2 { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 26px 0 10px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li a.row {
    display: flex; gap: 12px; align-items: baseline; min-height: 48px;
    padding: 13px 2px; color: inherit; text-decoration: none;
  }
  li a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  li .t { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .9rem; min-width: 4.2em; flex: none; }
  li .b { flex: 1; min-width: 0; }
  li.past { opacity: .42; }
  li.active .b { color: var(--accent); font-weight: 700; }
  details { margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; padding: 15px 2px; min-height: 48px; color: var(--dim); }
  .cand { font-size: .9rem; color: var(--dim); }
  .cand b { color: var(--ink); }
  footer { margin-top: 30px; font-size: .78rem; color: var(--dim); }
  footer a { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="trip-title"></h1>
    <div class="clock"><span id="clock">--</span><small id="today"></small></div>
  </header>
  <p id="status" class="sr-only" aria-live="polite"></p>
  <div id="live"></div>
  <div id="rest"></div>
  <footer id="foot"></footer>
</div>
<script type="module">
__SCHEDULE__

const TRIP = __TRIP__;

const pad = (n) => String(n).padStart(2, "0");
const hhmm = (mins) => pad(Math.floor(mins / 60) % 24) + ":" + pad(mins % 60);
const $ = (sel, root = document) => root.querySelector(sel);

// Build one card shell. Fields are filled in place on every tick, so the DOM
// is never thrown away. Rebuilding it would close open <details>, drop
// keyboard focus, and clear any text the user selected.
function cardShell(id) {
  const el = document.createElement("div");
  el.className = "card";
  el.id = id;
  el.innerHTML =
    '<div class="kicker"></div>' +
    '<p class="name"></p>' +
    '<div class="when"></div>' +
    '<div class="leave" hidden></div>' +
    '<p class="note" hidden></p>' +
    '<a class="maps" target="_blank" rel="noopener" hidden></a>';
  return {
    el,
    kicker: $(".kicker", el),
    name: $(".name", el),
    when: $(".when", el),
    leave: $(".leave", el),
    note: $(".note", el),
    maps: $(".maps", el),
  };
}

function fill(card, { kicker, name, when, leave, note, risk, maps, hot }) {
  card.kicker.textContent = kicker;
  card.kicker.classList.toggle("hot", !!hot);
  card.el.classList.toggle("now", !!hot);
  card.name.textContent = name;
  card.when.textContent = when || "";
  card.when.hidden = !when;
  card.leave.textContent = leave ? leave.text : "";
  card.leave.hidden = !leave;
  if (leave) card.leave.classList.toggle("urgent", leave.urgent);
  card.note.textContent = note || "";
  card.note.hidden = !note;
  card.note.classList.toggle("risk", !!risk);
  if (maps) { card.maps.href = maps.href; card.maps.textContent = maps.label; }
  card.maps.hidden = !maps;
}

const nowCard = cardShell("now-card");
const nextCard = cardShell("next-card");
$("#live").append(nowCard.el, nextCard.el);

// Day lists are static content. Build them once; ticks only retag rows.
const rows = new Map();
let builtForDate = null;

function buildDays(todayDate) {
  const rest = $("#rest");
  rest.textContent = "";
  rows.clear();
  const days = [...TRIP.days].sort((a, b) => a.date.localeCompare(b.date));

  for (const day of days) {
    const list = document.createElement("ol");
    for (const it of day.items) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "row";
      a.href = it.maps;
      a.target = "_blank";
      a.rel = "noopener";
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = it.start;
      const b = document.createElement("span");
      b.className = "b";
      b.textContent = it.name;
      a.append(t, b);
      li.append(a);
      list.append(li);
      rows.set(day.date + "#" + it.id, { li, item: it });
    }
    if (day.date === todayDate) {
      const h = document.createElement("h2");
      h.textContent = day.label;
      rest.append(h, list);
    } else {
      const d = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = day.label;
      d.append(sum, list);
      rest.append(d);
    }
  }

  for (const c of TRIP.candidates || []) {
    if (c === (TRIP.candidates || [])[0]) {
      const h = document.createElement("h2");
      h.textContent = "Unresolved";
      rest.append(h);
    }
    const p = document.createElement("p");
    p.className = "cand";
    const b = document.createElement("b");
    b.textContent = c.name;
    p.append(b, document.createTextNode(" " + c.why));
    rest.append(p);
  }
  builtForDate = todayDate;
}

const foot = $("#foot");
{
  const a = document.createElement("a");
  a.href = TRIP.base.maps;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = TRIP.base.address;
  foot.append(document.createTextNode("Base: "), a,
    document.createTextNode(". Clock is " + TRIP.timezone + ", whatever your phone says."));
}
$("#trip-title").textContent = TRIP.title;


let announced = "";

function tick() {
  const now = Date.now();
  const wall = wallClock(now, TRIP.timezone);
  const r = resolve(TRIP, now);

  $("#clock").textContent = hhmm(wall.minutes);
  const todayDay = TRIP.days.find((d) => d.date === wall.date);
  $("#today").textContent = todayDay
    ? todayDay.label.split("\u00b7")[0].trim()
    : TRIP.timezone.split("/")[1].replace("_", " ");
  if (wall.date !== builtForDate) buildDays(wall.date);

  if (r.state === "during") {
    fill(nowCard, {
      hot: true,
      kicker: "You should be here now",
      name: r.current.name,
      when: r.current.start + "–" + r.current.end + " · " + r.current.address,
      note: r.current.note,
      risk: /^RISK:|^BOOK /.test(r.current.note || ""),
      maps: { href: r.current.maps, label: "Open in Maps" },
    });
  } else {
    const copy = {
      gap: ["Nothing scheduled right now", "Free", "Next up below."],
      before: ["Not started yet", "Free", "The first day has not begun."],
      done: ["Day done", "That is the lot", "Go to bed."],
      after: ["Trip over", "Nothing left", "Hope it was good."],
    }[r.state];
    fill(nowCard, { kicker: copy[0], name: copy[1], when: copy[2] });
  }

  if (r.next) {
    let leave = null;
    if (r.day) {
      const leaveAt = toMinutes(r.next.start) - (r.next.travelMin || 0);
      const mins = leaveAt - wall.minutes;
      const mode = r.next.travelMode || "";
      const dur = (r.next.travelMin || 0) + " min";
      leave = {
        urgent: mins <= 15,
        text: mins <= 0
          ? "Leave now · " + mode + " " + dur
          : "Leave by " + hhmm(leaveAt) + " · " + mode + " " + dur + " · in " + mins + " min",
      };
    }
    fill(nextCard, {
      kicker: "Next",
      name: r.next.name,
      when: r.next.start + "–" + r.next.end + " · " + r.next.address,
      leave,
      note: r.next.note,
      risk: /^RISK:|^BOOK /.test(r.next.note || ""),
      maps: { href: r.next.maps, label: "Open in Maps" },
    });
    nextCard.el.hidden = false;
  } else {
    nextCard.el.hidden = true;
  }

  for (const [key, { li, item }] of rows) {
    const today = key.startsWith(wall.date);
    const active = today && toMinutes(item.start) <= wall.minutes && wall.minutes < toMinutes(item.end);
    const past = today && wall.minutes >= toMinutes(item.end);
    li.classList.toggle("active", active);
    li.classList.toggle("past", past);
  }

  // Announce only when the place changes, never on the ticking countdown.
  const key = r.state + ":" + (r.current ? r.current.id : "-");
  if (key !== announced) {
    announced = key;
    $("#status").textContent = r.current
      ? "Now: " + r.current.name
      : nowCard.name.textContent;
  }
}

buildDays(wallClock(Date.now(), TRIP.timezone).date);
tick();
setInterval(tick, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
